<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b3a"><title>HMFI | Admin Console</title><script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#071b3a;--blue:#1264c8;--red:#e32636;--ink:#17263c;--muted:#68788e;--line:#e3eaf3;--bg:#f4f7fb;--white:#fff;--shadow:0 16px 42px #0a285014}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:white;box-shadow:0 5px 24px #071b3a20}.bar{max-width:1200px;margin:auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid white}.brand b{font-size:17px;letter-spacing:1.5px}.brand small{display:block;color:#c6d8f4;font-size:9px;letter-spacing:1.3px;font-weight:bold}.actions{display:flex;gap:7px;flex-wrap:wrap}
main{max-width:1180px;margin:auto;padding:22px}.btn{border:0;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:800}.primary{background:var(--blue);color:white}.red{background:var(--red);color:white}.light{background:white;color:var(--navy);border:1px solid var(--line)}.ghost{background:#ffffff18;color:white;border:1px solid #ffffff35}.full{width:100%}
.hero{border-radius:25px;padding:38px;background:radial-gradient(circle at 85% 10%,#2e74c6,transparent 32%),linear-gradient(130deg,#071b3a,#0b438e);color:white;box-shadow:var(--shadow);overflow:hidden}.eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:#d8e7fb;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.06;margin:14px 0}.hero p{max-width:650px;color:#d8e7fb;line-height:1.7;font-size:14px}.hero .btn{margin:10px 7px 0 0}.stats{display:flex;gap:25px;flex-wrap:wrap;margin-top:24px}.stats b{display:block;font-size:20px}.stats span{font-size:10px;color:#c8d8ef}
h2,h3{color:var(--navy);margin:0 0 9px}.section{margin:27px 0 13px}.section p,.muted{color:var(--muted);font-size:12px;line-height:1.6}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card,.plan,.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 5px 20px #102d5008}.plan.featured{border:2px solid var(--blue);box-shadow:var(--shadow)}.price{font-size:28px;font-weight:900;color:var(--navy);margin:12px 0}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:27px;color:var(--navy);margin:7px 0}
label{display:block;font-size:11px;font-weight:800;color:#34465f;margin-top:9px}.input{width:100%;padding:12px 13px;border:1px solid #d9e2ee;border-radius:11px;margin:6px 0 8px;background:white;font-size:13px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1264c817}textarea.input{min-height:100px;resize:vertical}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:white;color:#42536c;font-size:11px;font-weight:800}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eaf2ff;color:var(--blue);font-size:9px;font-weight:900}.redpill{background:#fff0f1;color:var(--red)}.notice{background:#eef5ff;color:#234b7b;padding:13px;border-radius:12px;font-size:12px;line-height:1.6}.warning{background:#fff0f1;color:#9d1c2a}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}.hidden{display:none!important}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.side{background:var(--navy);border-radius:18px;padding:12px;height:max-content;position:sticky;top:82px}.side button{display:block;width:100%;border:0;text-align:left;background:transparent;color:#cbdaf0;padding:12px;border-radius:9px;font-size:12px;font-weight:800}.side button.active,.side button:hover{background:#ffffff1b;color:white}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:600px;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}
.preview{width:100%;height:480px;border:1px solid var(--line);border-radius:12px;background:white}footer{text-align:center;padding:26px;color:#77869a;font-size:11px}
@media(max-width:850px){.g4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}}
@media(max-width:620px){main{padding:13px}.bar{padding:9px 13px}.brand img{width:39px;height:39px}.brand b{font-size:14px}.brand small{font-size:7px}.hero{padding:25px 20px}.g2,.g3,.g4{grid-template-columns:1fr}.hero h1{font-size:33px}.actions .btn{padding:9px 10px}}
