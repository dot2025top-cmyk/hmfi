<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | HMFI</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f6fc;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #123d70;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5e0;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 7px;
      background: #0756a5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #13833b;
    }

    .error {
      color: #d62828;
    }

    .hidden {
      display: none;
    }

    a {
      color: #0756a5;
      font-weight: bold;
      text-decoration: none;
    }
  </style></head><body><div class="container">  <h2>Reset Your Password</h2>  <p id="description">
    Enter your new password below.
  </p>  <div id="loading">
    <p>Verifying your password reset link...</p>
  </div>  <form id="resetForm" class="hidden"><label for="newPassword">New Password</label>
<input
  type="password"
  id="newPassword"
  placeholder="Enter new password"
  minlength="8"
  required
  autocomplete="new-password"
>

<label for="confirmPassword">Confirm Password</label>
<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm new password"
  minlength="8"
  required
  autocomplete="new-password"
>

<button type="submit" id="submitButton">
  Change Password
</button>

  </form>  <div id="message"></div>  <div id="loginLink" class="hidden" style="text-align:center;margin-top:20px;">
    <a href="https://hmfi.vercel.app">Go to Login</a>
  </div></div><script>
  // =====================================
  // SUPABASE CONFIGURATION
  // =====================================

  const SUPABASE_URL = "https://vzhapbndugbdwbzkjevy.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true,
        flowType: "implicit"
      }
    }
  );

  // =====================================
  // PAGE ELEMENTS
  // =====================================

  const loading = document.getElementById("loading");
  const resetForm = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const loginLink = document.getElementById("loginLink");
  const submitButton = document.getElementById("submitButton");

  let recoverySessionReady = false;

  function showError(text) {
    loading.classList.add("hidden");
    resetForm.classList.add("hidden");
    message.className = "error";
    message.textContent = text;
    loginLink.classList.remove("hidden");
  }

  function showSuccess() {
    loading.classList.add("hidden");
    resetForm.classList.add("hidden");

    message.className = "success";
    message.textContent = "Password changed, go to login.";

    loginLink.classList.remove("hidden");

    setTimeout(() => {
      window.location.href = "https://hmfi.vercel.app";
    }, 3000);
  }

  // =====================================
  // VERIFY RECOVERY LINK
  // =====================================

  async function verifyRecoveryLink() {

    const hashParams = new URLSearchParams(
      window.location.hash.substring(1)
    );

    const recoveryType = hashParams.get("type");
    const hashError = hashParams.get("error");

    if (hashError) {
      showError("Link expired, request new one.");
      return;
    }

    if (recoveryType !== "recovery") {
      showError("Link expired, request new one.");
      return;
    }

    try {

      // Allow Supabase to process the recovery URL.
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        showError("Link expired, request new one.");
        return;
      }

      recoverySessionReady = true;

      loading.classList.add("hidden");
      resetForm.classList.remove("hidden");

      document.getElementById("description").textContent =
        "Choose a new password for your HMFI account.";

    } catch (err) {
      showError("Link expired, request new one.");
    }
  }

  // =====================================
  // CHANGE PASSWORD
  // =====================================

  resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!recoverySessionReady) {
      showError("Link expired, request new one.");
      return;
    }

    const newPassword =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
      message.className = "error";
      message.textContent =
        "Password must contain at least 8 characters.";
      return;
    }

    if (newPassword !== confirmPassword) {
      message.className = "error";
      message.textContent = "Passwords do not match.";
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Updating Password...";

    try {

      const { error } = await supabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        throw error;
      }

      showSuccess();

    } catch (err) {

      message.className = "error";
      message.textContent =
        err.message || "Unable to change password. Request a new link.";

      submitButton.disabled = false;
      submitButton.textContent = "Change Password";
    }

  });

  // =====================================
  // START PAGE
  // =====================================

  verifyRecoveryLink();

</script></body>
</html>
